name: Daily contribution

on:
  schedule:
    # 15:10 UTC = 20:10 Pakistan Standard Time (UTC+5)
    - cron: "10 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add today's contribution
        shell: bash
        run: |
          git config user.name "Muhib Mirza"
          git config user.email "143287975+Muhibmirza@users.noreply.github.com"
          printf 'Daily contribution: %s\n\n' "$(TZ=Asia/Karachi date '+%Y-%m-%d %H:%M:%S %Z')" >> README.md
          git add README.md
          git commit -m "Daily contribution: $(TZ=Asia/Karachi date '+%Y-%m-%d')"
          git push
